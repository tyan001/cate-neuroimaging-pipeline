name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      # Rules are pinned here (no ruff.toml) so a new ruff release can't change what CI checks.
      # `src` marks the stage scripts as first-party modules for import sorting.
      # To lint another stage, add its folder to both `src` and the path list at the end.
      - name: Ruff
        run: >-
          uv run ruff check --output-format=github
          --select E4,E7,E9,F,I,B,UP --target-version py312 --line-length 120
          --config "src = ['pipeline/1_ingest', 'tests', 'tests/fixtures']"
          pipeline/1_ingest tests

  ingest:
    name: 1_ingest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ingest tests
        run: uv run pytest tests/ingest tests/test_fixture_manifest.py -v

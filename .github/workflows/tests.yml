name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint


      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      # Rules are pinned here (no ruff.toml) so a new ruff release can't change what CI checks.
      # `src` marks the stage scripts as first-party modules for import sorting.
      # To lint another stage, add its folder to both `src` and the path list at the end.
      - name: Ruff
        run: >-
          uv run ruff check --output-format=github
          --select E4,E7,E9,F,I,B,UP --target-version py312 --line-length 120
          --config "src = ['pipeline/1_ingest', 'pipeline/6_extract', 'pipeline/7_DirectoryStats', 'sync', 'tests', 'tests/fixtures']"
          pipeline/1_ingest pipeline/6_extract pipeline/7_DirectoryStats sync tests

  # One job per pipeline stage, so a failure names the stage and can be re-run on its own.
  # To add a stage: add an entry to `suite` with the folder its tests live in.
  pytest:
    name: ${{ matrix.suite.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        suite:
          - name: 1_ingest
            paths: tests/ingest tests/test_fixture_manifest.py
          - name: 4_qc
            paths: tests/qc
          - name: 5_aggregate
            paths: tests/aggregate
          - name: 6_extract
            paths: tests/extract
          # find_missing, process_missing, merge_batch (needs rsync, present on ubuntu-latest)
          # and directory_data_count
          - name: 7_DirectoryStats
            paths: tests/missing
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # One cache per Python version; the dependencies are the same for every suite.
          cache-suffix: tests

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ${{ matrix.suite.name }} tests
        run: uv run pytest ${{ matrix.suite.paths }} -v
